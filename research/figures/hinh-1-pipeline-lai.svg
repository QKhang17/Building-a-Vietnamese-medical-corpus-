<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102a43}.sub{font:400 19px Arial,sans-serif;fill:#486581}
      .h{font:700 22px Arial,sans-serif;fill:#102a43}.t{font:400 17px Arial,sans-serif;fill:#243b53}
      .small{font:400 15px Arial,sans-serif;fill:#486581}.box{stroke:#486581;stroke-width:2;rx:18}
      .arrow{stroke:#334e68;stroke-width:3;fill:none;marker-end:url(#a)}
      .dash{stroke:#829ab1;stroke-width:2.5;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334e68"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#f7fafc"/>
  <text x="70" y="62" class="title">Hình 1. Pipeline lai có ràng buộc và truy vết thực nghiệm</text>
  <text x="70" y="96" class="sub">Mỗi đầu ra định lượng được liên kết với article ID, phiên bản model, prompt và manifest từ điển.</text>

  <g filter="url(#s)"><rect x="70" y="180" width="250" height="150" class="box" fill="#e6fffa"/></g>
  <text x="195" y="220" text-anchor="middle" class="h">Tóm tắt nguyên văn</text>
  <text x="195" y="255" text-anchor="middle" class="t">article ID · checksum</text>
  <text x="195" y="286" text-anchor="middle" class="t">offset Unicode [start,end)</text>

  <g filter="url(#s)"><rect x="430" y="135" width="300" height="170" class="box" fill="#ebf8ff"/></g>
  <text x="580" y="178" text-anchor="middle" class="h">Nhánh từ điển</text>
  <text x="580" y="215" text-anchor="middle" class="t">Matcher + mã thuật ngữ</text>
  <text x="580" y="246" text-anchor="middle" class="t">manifest SHA-256</text>
  <text x="580" y="277" text-anchor="middle" class="small">span · type · code · provenance</text>

  <g filter="url(#s)"><rect x="430" y="380" width="300" height="190" class="box" fill="#fff5f5"/></g>
  <text x="580" y="422" text-anchor="middle" class="h">Nhánh Gemini</text>
  <text x="580" y="458" text-anchor="middle" class="t">JSON: term/start/end/type/code</text>
  <text x="580" y="490" text-anchor="middle" class="t">model · temperature · prompt hash</text>
  <text x="580" y="522" text-anchor="middle" class="small">token vào/ra · latency · raw cache</text>

  <g filter="url(#s)"><rect x="850" y="330" width="330" height="245" class="box" fill="#fffbea"/></g>
  <text x="1015" y="374" text-anchor="middle" class="h">Hậu kiểm từng ứng viên</text>
  <text x="890" y="415" class="t">• JSON / schema / whitelist loại</text>
  <text x="890" y="448" class="t">• offset hợp lệ</text>
  <text x="890" y="481" class="t">• surface = X[start:end]</text>
  <text x="890" y="514" class="t">• trùng lặp và chồng lấn</text>
  <text x="890" y="547" class="small">Mỗi nguyên nhân được ghi thành event</text>

  <g filter="url(#s)"><rect x="1280" y="215" width="260" height="180" class="box" fill="#f3e8ff"/></g>
  <text x="1410" y="258" text-anchor="middle" class="h">Hợp nhất lai</text>
  <text x="1410" y="296" text-anchor="middle" class="t">Từ điển ưu tiên metadata</text>
  <text x="1410" y="328" text-anchor="middle" class="t">Longest non-overlap</text>
  <text x="1410" y="360" text-anchor="middle" class="small">entity cuối + nguồn quyết định</text>

  <g filter="url(#s)"><rect x="1245" y="555" width="330" height="180" class="box" fill="#e9fbe9"/></g>
  <text x="1410" y="597" text-anchor="middle" class="h">Hai đầu ra dùng chung trace</text>
  <text x="1280" y="638" class="t">1. Preannotation development</text>
  <text x="1280" y="672" class="t">2. Dự đoán benchmark test</text>
  <text x="1280" y="706" class="small">Không dùng test để sửa prompt/quy tắc</text>

  <g filter="url(#s)"><rect x="460" y="700" width="620" height="125" class="box" fill="#edf2f7"/></g>
  <text x="770" y="740" text-anchor="middle" class="h">Kho truy vết và raw cache bất biến</text>
  <text x="770" y="777" text-anchor="middle" class="t">run UUID · candidate outcome · stage latency · token · cost · audit event</text>
  <text x="770" y="805" text-anchor="middle" class="small">Bảng trong bài được sinh tự động từ các bản ghi này</text>

  <path d="M320 235 H430" class="arrow"/><path d="M320 275 C370 275 370 475 430 475" class="arrow"/>
  <path d="M730 220 C1020 220 1040 265 1280 280" class="arrow"/>
  <path d="M730 475 H850" class="arrow"/><path d="M1180 450 C1240 450 1210 345 1280 330" class="arrow"/>
  <path d="M1410 395 V555" class="arrow"/>
  <path d="M580 570 C580 640 670 650 700 700" class="dash"/>
  <path d="M1015 575 C1015 635 910 650 865 700" class="dash"/>
  <path d="M1280 645 H1080" class="dash"/>
</svg>
