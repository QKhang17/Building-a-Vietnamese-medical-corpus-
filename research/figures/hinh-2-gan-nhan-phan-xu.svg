  <path d="M745 230 C800 230 810 300 860 315" class="arrow"/><path d="M745 500 C800 500 810 420 860 400" class="arrow"/>
  <path d="M1170 330 H1275" class="arrow"/><path d="M1405 375 V485" class="arrow"/>
  <path d="M1170 440 C1240 440 1230 570 1275 570" class="dash"/>
  <path d="M600 590 V700" class="dash"/><path d="M1015 480 C1015 600 940 630 900 700" class="dash"/>
</svg>
